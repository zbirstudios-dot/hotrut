<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Thunderbarber Studio</title>
<desc id="desc">Marca visual con relampago dorado y texto Thunder Barber Studio.</desc>
<defs>
  <linearGradient id="gold" x1="0%" x2="100%" y1="0%" y2="0%">
    <stop offset="0%" stop-color="#7a5c18"/>
    <stop offset="35%" stop-color="#c9a84c"/>
    <stop offset="62%" stop-color="#f5e0a0"/>
    <stop offset="100%" stop-color="#c9a84c"/>
  </linearGradient>
  <linearGradient id="gold-soft" x1="0%" x2="100%" y1="0%" y2="0%">
    <stop offset="0%" stop-color="#3d2e0c" stop-opacity=".2"/>
    <stop offset="50%" stop-color="#c9a84c" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#3d2e0c" stop-opacity=".2"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0  0 0.88 0 0 0  0 0 0.52 0 0  0 0 0 0.9 0" result="goldGlow"/>
    <feMerge>
      <feMergeNode in="goldGlow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="1200" height="700" fill="none"/>

<g opacity=".9">
  <path d="M168 148H466" stroke="url(#gold-soft)" stroke-width="3"/>
  <path d="M734 148H1032" stroke="url(#gold-soft)" stroke-width="3"/>
  <path d="M212 178H446" stroke="url(#gold-soft)" stroke-width="1.5"/>
  <path d="M754 178H988" stroke="url(#gold-soft)" stroke-width="1.5"/>
</g>

<path
  d="M623 70L548 202H630L572 324L733 142H644L702 70Z"
  fill="url(#gold)"
  filter="url(#glow)"
/>

<text
  x="600"
  y="390"
  text-anchor="middle"
  font-family="Arial, Helvetica, sans-serif"
  font-size="146"
  font-weight="700"
  letter-spacing="18"
  fill="url(#gold)"
>
  THUNDER
</text>

<text
  x="600"
  y="535"
  text-anchor="middle"
  font-family="Arial, Helvetica, sans-serif"
  font-size="146"
  font-weight="700"
  letter-spacing="18"
  fill="none"
  stroke="url(#gold)"
  stroke-width="3"
>
  BARBER
</text>

<text
  x="600"
  y="625"
  text-anchor="middle"
  font-family="Arial, Helvetica, sans-serif"
  font-size="46"
  font-weight="700"
  letter-spacing="32"
  fill="#c9a84c"
  opacity=".55"
>
  STUDIO
</text>
</svg>
